name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate phrase list
        run: python scripts/validate_phrases.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build review page
        run: python scripts/build_review.py
